project_id = "thijskooptuauto"

[api]
enabled = true
port = 54521
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54522
shadow_port = 54520

[studio]
enabled = true
port = 54523

[local_smtp]
enabled = true
port = 54524
smtp_port = 54525
pop3_port = 54526

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://127.0.0.1:3000/auth/callback"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.email.template.confirmation]
subject = "Bevestig je account bij Thijskooptuauto"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Open je autoaanvraag veilig"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Kies een nieuw wachtwoord voor Thijskooptuauto"
content_path = "./supabase/templates/recovery.html"

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"
